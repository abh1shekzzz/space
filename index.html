<!DOCTYPE html>
<html>
<head>
  <title>my site</title>

  <style>
    body {
      font-family: monospace;
      background: white;
    }

    .random {
      position: absolute;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>hi</h1>

<p class="random" style="top: 50px; left: 100px;">u r lazy</p>
<p class="random" style="top: 200px; left: 300px;">i like math</p>
<p class="random" style="top: 400px; left: 150px;">go study</p>

<button onclick="randomText()">click me</button>

<p id="output"></p>

<script>
function randomText() {
  const messages = ["lfg", "touch grass", "build something"];
  const random = messages[Math.floor(Math.random() * messages.length)];
  document.getElementById("output").innerText = random;
}
</script>

</body>
</html>
